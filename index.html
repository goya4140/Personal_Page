<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>王邻皓 - 个人主页</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ========== 导航栏 ========== -->
  <nav id="navbar">
    <div class="nav-inner">
      <span class="nav-logo">WLH</span>
      <ul class="nav-links">
        <li><a href="#about"        class="nav-link">关于我</a></li>
        <li><a href="#publications" class="nav-link">论文发表</a></li>
        <li><a href="#projects"     class="nav-link">工程项目</a></li>
        <li><a href="#contact"      class="nav-link">联系方式</a></li>
      </ul>
    </div>
  </nav>

  <!-- ========== 关于我 ========== -->
  <section id="about" class="section fade-target">
    <div class="about-wrap">

      <div class="avatar-box">
        <img
          src="images/wanglinhao.jpg"
          alt="王邻皓头像"
          id="avatar"
          onerror="this.style.display='none'; document.getElementById('avatar-fallback').style.display='flex';"
        />
        <div id="avatar-fallback" class="avatar-fallback">WLH</div>
      </div>

      <div class="about-text">
        <h1 class="name">王邻皓</h1>
        <p class="subtitle">
          <span id="typing-output"></span><span class="cursor">|</span>
        </p>
        <p class="bio">
          我是吉林大学计算机科学专业的大二学生，专注于奖励模型与&nbsp;RLHF&nbsp;研究，
          同时推进多智能体 ToM 推理框架 MACM 的设计，并以框架优先、高执行力的方式
          在科研、课业与 AI 产品开发之间并行探索。
        </p>
        <div class="tags" id="tags-container"></div>
      </div>

    </div>
  </section>

  <!-- ========== 论文发表 ========== -->
  <section id="publications" class="section fade-target">
    <h2 class="section-title">论文发表</h2>
    <!-- 论文卡片由 JS 动态渲染 -->
    <div class="pub-list" id="pub-list"></div>
  </section>

  <!-- ========== 工程项目 ========== -->
  <section id="projects" class="section fade-target">
    <h2 class="section-title">工程项目</h2>
    <!-- 项目卡片由 JS 动态渲染 -->
    <div class="projects-grid" id="projects-grid"></div>
  </section>

  <!-- ========== 联系方式 ========== -->
  <section id="contact" class="section fade-target">
    <h2 class="section-title">联系方式</h2>
    <div class="contact-grid" id="contact-grid"></div>
  </section>

  <!-- ========== 页脚 ========== -->
  <footer class="footer">
    <p>&copy; 2026 王邻皓 · Jilin University CS</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
