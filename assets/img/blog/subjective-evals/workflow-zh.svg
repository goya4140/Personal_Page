<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="740" viewBox="0 0 1440 740" role="img" aria-labelledby="title desc">
<title id="title">科研报告：从质量要求到可核查证据</title><desc id="desc">教学方案 · 输入、判定、版本和使用记录均可回看</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b8477"/></marker></defs>
<rect width="1440" height="740" rx="24" fill="#f5f2e9"/>
<g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif">
<text x="60" y="78" font-size="38" fill="#17313c" font-weight="700">科研报告：从质量要求到可核查证据</text>
<text x="60" y="125" font-size="23" fill="#536a6f" font-weight="400">教学方案 · 输入、判定、版本和使用记录均可回看</text>
<rect x="60" y="190" width="410" height="310" rx="20" fill="#fffefa" stroke="#b7c9be" stroke-width="2"/>
<text x="85" y="245" font-size="28" fill="#17313c" font-weight="700">01  明确证据</text>
<text x="85" y="290" font-size="23" fill="#536a6f" font-weight="400">任务 + 原文材料</text>
<text x="85" y="350" font-size="22" fill="#17313c" font-weight="400">事实是否有据</text>
<text x="85" y="401" font-size="22" fill="#17313c" font-weight="400">比较条件是否一致</text>
<text x="85" y="452" font-size="22" fill="#17313c" font-weight="400">实验建议能否执行</text>
<path d="M477 341 H506" fill="none" stroke="#5b8477" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="515" y="190" width="410" height="310" rx="20" fill="#fffefa" stroke="#b7c9be" stroke-width="2"/>
<text x="540" y="245" font-size="28" fill="#17313c" font-weight="700">02  独立核验</text>
<text x="540" y="290" font-size="23" fill="#536a6f" font-weight="400">报告 + 评审记录</text>
<text x="540" y="350" font-size="22" fill="#17313c" font-weight="400">规则和证据位置</text>
<text x="540" y="401" font-size="22" fill="#17313c" font-weight="400">裁判开发 / 独立验收</text>
<text x="540" y="452" font-size="22" fill="#17313c" font-weight="400">保留误判和分歧原因</text>
<path d="M932 341 H961" fill="none" stroke="#5b8477" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="970" y="190" width="410" height="310" rx="20" fill="#fffefa" stroke="#b7c9be" stroke-width="2"/>
<text x="995" y="245" font-size="28" fill="#17313c" font-weight="700">03  比较与使用</text>
<text x="995" y="290" font-size="23" fill="#536a6f" font-weight="400">版本差值 + 实际反馈</text>
<text x="995" y="350" font-size="22" fill="#17313c" font-weight="400">配对差值与不确定性</text>
<text x="995" y="401" font-size="22" fill="#17313c" font-weight="400">研究者采用 / 修订记录</text>
<text x="995" y="452" font-size="22" fill="#17313c" font-weight="400">质量、时间与费用</text>
<path d="M 1175 512 V 600 H 265 V 515" fill="none" stroke="#5b8477" stroke-dasharray="10 8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="330" y="568" width="780" height="52" rx="10" fill="#f5f2e9"/>
<text x="355" y="602" font-size="24" fill="#17313c" font-weight="400">把新失败写成测试题，进入下一版评测</text>
<text x="60" y="690" font-size="21" fill="#536a6f" font-weight="400">本文自拟方案；未实施实验；不代表原作者的软件架构</text>
</g></svg>
